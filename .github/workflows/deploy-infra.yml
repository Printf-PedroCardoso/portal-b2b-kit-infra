# ==============================================================================
# Atualiza Gateway, Frontends e arquivos de composicao/scripts em app1 e app2
# ==============================================================================

name: Sync Infra e Gateway (AWS Integracao)

on:
  push:
    branches:
      - main
    paths:
      - "docker-compose.aws.yml"
      - "gateway/**"
      - "frontends/**"
      - "scripts/aws-*.sh"
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  ENVIRONMENT: integracao

jobs:
  sync-app-nodes:
    name: Atualizar Gateway/Frontends em app1 e app2
    runs-on: ubuntu-latest

    steps:
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sincronizar repositorio e recarregar Gateway/Frontends via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Ambiente,Values=${ENVIRONMENT}" "Key=tag:Role,Values=Application" \
            --comment "Sync Infra/Gateway (GitHub Actions)" \
            --parameters 'commands=[
              "set -eu",
              "cd /opt/portal-b2b",
              "git pull --ff-only",
              "chmod +x scripts/aws-*.sh",
              "docker compose -f docker-compose.aws.yml --env-file .env --env-file .env.tags up -d --build gateway frontends",
              "docker compose -f docker-compose.aws.yml --env-file .env --env-file .env.tags ps gateway frontends"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          for i in $(seq 1 36); do
            STATUSES=$(aws ssm list-command-invocations \
              --command-id "${COMMAND_ID}" \
              --query "CommandInvocations[].Status" \
              --output text)
            echo "[Tentativa ${i}/36] Status: ${STATUSES:-Aguardando...}"
            if [[ -n "${STATUSES}" ]] && ! echo "${STATUSES}" | grep -qE "Pending|InProgress|Delayed"; then
              break
            fi
            sleep 5
          done

          FAILED=0
          for INSTANCE_ID in $(aws ssm list-command-invocations --command-id "${COMMAND_ID}" --query "CommandInvocations[].InstanceId" --output text); do
            STATUS=$(aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --query "Status" --output text)
            echo "=== ${INSTANCE_ID} (${STATUS}) ==="
            aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --query "StandardOutputContent" --output text
            if [[ "${STATUS}" != "Success" ]]; then
              aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --query "StandardErrorContent" --output text
              FAILED=1
            fi
          done

          exit "${FAILED}"
