# ==============================================================================
# Docker Compose para Ambiente AWS (EC2 app1 e app2)
# Utiliza RDS PostgreSQL, EC2 de Mensageria (Redpanda + Redis) e imagens no ECR.
# ==============================================================================

networks:
  portal-net:
    driver: bridge
    name: portal-net

x-common-env: &common-env
  DB_HOST: ${RDS_HOST}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:-portal_b2b}
  DB_POOL_MIN: "1"
  DB_POOL_MAX: "5"
  KAFKA_BOOTSTRAP_SERVERS: ${MSG_PRIVATE_IP}:19092
  SCHEMA_REGISTRY_URL: http://${MSG_PRIVATE_IP}:18081
  REDIS_HOST: ${MSG_PRIVATE_IP}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  ENVIRONMENT: ${ENVIRONMENT:-integracao}

services:
  # ----------------------------------------------------------------------------
  # Borda Local da EC2 (Recebe trafego do ALB na porta 8080)
  # ----------------------------------------------------------------------------
  gateway:
    image: nginx:1.26-alpine
    container_name: portal-b2b-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/nginx.aws.conf:/etc/nginx/nginx.conf:ro
    networks:
      - portal-net

  frontends:
    build:
      context: ./frontends
    container_name: portal-b2b-frontends
    restart: unless-stopped
    networks:
      - portal-net

  # ----------------------------------------------------------------------------
  # 9 Microsservicos de Dominio (Imagens versionadas no Amazon ECR)
  # ----------------------------------------------------------------------------
  usuarios-service:
    image: ${ECR_REGISTRY}/portal-b2b/usuarios-service:${TAG_USUARIOS_SERVICE:-unconfigured}
    container_name: usuarios-service
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVICE_NAME: usuarios-service
      PORT: "8101"
      DB_USER: svc_usuarios
      DB_PASSWORD: ${DB_PASS_SVC_USUARIOS}
      DB_SCHEMA: usuarios
      DATABASE_URL: postgresql://svc_usuarios:${DB_PASS_SVC_USUARIOS}@${RDS_HOST}:${DB_PORT:-5432}/${DB_NAME:-portal_b2b}
    networks:
      - portal-net

  produtos-service:
