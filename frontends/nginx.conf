server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    location /usuarios/ {
        alias /usr/share/nginx/html/usuarios/;
        try_files $uri $uri/ /usuarios/index.html;
    }

    location /produtos/ {
        alias /usr/share/nginx/html/produtos/;
        try_files $uri $uri/ /produtos/index.html;
    }

    location /fornecimentos/ {
        alias /usr/share/nginx/html/fornecimentos/;
        try_files $uri $uri/ /fornecimentos/index.html;
    }

    location /demanda/ {
        alias /usr/share/nginx/html/demanda/;
        try_files $uri $uri/ /demanda/index.html;
    }

    location /negociacao/ {
        alias /usr/share/nginx/html/negociacao/;
        try_files $uri $uri/ /negociacao/index.html;
    }

    location /pedidos/ {
        alias /usr/share/nginx/html/pedidos/;
        try_files $uri $uri/ /pedidos/index.html;
    }

    location /logistica/ {
        alias /usr/share/nginx/html/logistica/;
        try_files $uri $uri/ /logistica/index.html;
    }

    location / {
        return 200 "Portal B2B - Frontends Ativos (RFI-05)";
        add_header Content-Type text/plain;
    }
}
