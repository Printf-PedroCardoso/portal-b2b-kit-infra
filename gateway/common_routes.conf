# Aplicação de Rate Limiting (RNF-23)
limit_req zone=ip_limit burst=50 nodelay;

# Headers de Rastreamento e Balanceamento (RF-15, RFI-02)
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Correlation-Id $correlation_id_final;

add_header X-Correlation-Id $correlation_id_final always;
add_header X-Served-By $upstream_addr always; # RFI-02

# Roteamento dos 9 Prefixos de API (RFI-04)
location /api/v1/usuarios {
    proxy_pass http://usuarios_backend;
}

location /api/v1/produtos {
    proxy_pass http://produtos_backend;
}

location /api/v1/fornecimentos {
    proxy_pass http://fornecimentos_backend;
}

location /api/v1/demandas {
    proxy_pass http://demanda_backend;
}

location /api/v1/mercado {
    proxy_pass http://mercado_backend;
}

location /api/v1/negociacoes {
    proxy_pass http://negociacao_backend;
}

location /api/v1/pedidos {
    proxy_pass http://pedidos_backend;
}

location /api/v1/logistica {
    proxy_pass http://logistica_backend;
}

location /api/v1/transportadoras {
    proxy_pass http://transportadoras_backend;
}

# Roteamento dos 7 Front-ends por Subcaminho (RFI-05)
location /usuarios/ {
    proxy_pass http://frontends_backend;
}

location /produtos/ {
    proxy_pass http://frontends_backend;
}

location /fornecimentos/ {
    proxy_pass http://frontends_backend;
}

location /demanda/ {
    proxy_pass http://frontends_backend;
}

location /negociacao/ {
    proxy_pass http://frontends_backend;
}

location /pedidos/ {
    proxy_pass http://frontends_backend;
}

location /logistica/ {
    proxy_pass http://frontends_backend;
}

location / {
    return 200 "Portal B2B Gateway Ativo - Use /api/v1/... ou os front-ends em /<dominio>/ (RFI-01)\n";
    add_header Content-Type text/plain;
}
