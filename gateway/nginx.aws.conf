worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # DNS interno do Docker para resolucao dinamica de containers.
    # Permite que o Gateway suba mesmo antes de todos os 9 microsservicos estarem no ar.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Limite de tamanho de corpo HTTP: 1MB (RNF-11)
    client_max_body_size 1M;

    # Rate Limiting: 100 req/s com burst de 50 (RNF-23)
    limit_req_zone $binary_remote_addr zone=ip_limit:10m rate=100r/s;
    limit_req_status 429;

    # Timeouts: gateway -> servico 30s (CT-A07)
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Mapeamento do cabecalho de Correlation ID (RF-15)
    map $http_x_correlation_id $correlation_id_final {
        default $http_x_correlation_id;
        ""      $request_id;
    }

    # Na AWS, o ALB termina TLS (HTTPS:443) e encaminha HTTP para a porta 8080 de app1 e app2.
    server {
        listen 8080;
        server_name _;

        # Health checks exigidos pelo Target Group do ALB (INF-03, RF-17)
        location = /health {
            return 200 '{"status":"UP"}';
            add_header Content-Type application/json;
        }

        location = /health/ready {
            return 200 '{"status":"READY"}';
            add_header Content-Type application/json;
        }

        # Aplicacao de Rate Limiting (RNF-23)
        limit_req zone=ip_limit burst=50 nodelay;

        # Headers comuns
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Correlation-Id $correlation_id_final;

        add_header X-Correlation-Id $correlation_id_final always;
        add_header X-Served-By $hostname always;

        # ------------------------------------------------------------------
        # 1. Identity-Service / Usuarios (8101)
        # ------------------------------------------------------------------
        location /api/v1/auth/ {
            set $upstream_usuarios http://usuarios-service:8101;
            proxy_pass $upstream_usuarios;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Correlation-Id $correlation_id_final;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/v1/tenants {
            set $upstream_usuarios http://usuarios-service:8101;
            proxy_pass $upstream_usuarios;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Correlation-Id $correlation_id_final;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/v1/users/ {
            set $upstream_usuarios http://usuarios-service:8101;
            proxy_pass $upstream_usuarios;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Correlation-Id $correlation_id_final;
            proxy_set_header Authorization $http_authorization;
        }

        location = /.well-known/jwks.json {
            set $upstream_usuarios http://usuarios-service:8101;
            proxy_pass $upstream_usuarios;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Correlation-Id $correlation_id_final;
        }

        location /api/v1/usuarios {
            set $upstream_usuarios http://usuarios-service:8101;
            proxy_pass $upstream_usuarios;
        }

        # ------------------------------------------------------------------
        # 2. Demais Microsservicos de Dominio (8102 a 8109)
        # ------------------------------------------------------------------
        location /api/v1/produtos {
            set $upstream_produtos http://produtos-service:8102;
            proxy_pass $upstream_produtos;
        }

        location /api/v1/fornecimentos {
            set $upstream_fornecimentos http://fornecimentos-service:8103;
            proxy_pass $upstream_fornecimentos;
        }

        location /api/v1/demandas {
            set $upstream_demanda http://demanda-service:8104;
            proxy_pass $upstream_demanda;
        }

        location /api/v1/mercado {
            set $upstream_mercado http://mercado-service:8105;
            proxy_pass $upstream_mercado;
        }

        location /api/v1/negociacoes {
            set $upstream_negociacao http://negociacao-service:8106;
            proxy_pass $upstream_negociacao;
        }

        location /api/v1/pedidos {
            set $upstream_pedidos http://pedidos-service:8107;
            proxy_pass $upstream_pedidos;
        }

        location /api/v1/logistica {
            set $upstream_logistica http://logistica-service:8108;
            proxy_pass $upstream_logistica;
        }

        location /api/v1/transportadoras {
            set $upstream_transportadoras http://transportadoras-service:8109;
            proxy_pass $upstream_transportadoras;
        }

        # ------------------------------------------------------------------
        # 3. Front-ends estaticos
        # ------------------------------------------------------------------
        location ~ ^/(usuarios|produtos|fornecimentos|demanda|negociacao|pedidos|logistica)/ {
            set $upstream_frontends http://frontends:80;
            proxy_pass $upstream_frontends;
        }

        location / {
            return 200 "Portal B2B Gateway AWS Ativo - Use /api/v1/... ou os front-ends em /<dominio>/\n";
            add_header Content-Type text/plain;
        }
    }
}
