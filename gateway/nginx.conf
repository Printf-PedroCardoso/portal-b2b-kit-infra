worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Limite de tamanho de corpo HTTP: 1MB (RNF-11)
    client_max_body_size 1M;

    # Rate Limiting: 100 req/s com burst de 50 (RNF-23)
    limit_req_zone $binary_remote_addr zone=ip_limit:10m rate=100r/s;
    limit_req_status 429;

    # Timeouts: gateway -> servico 30s (CT-A07)
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Mapeamento do cabeçalho de Correlation ID (RF-15)
    # Se o cliente enviar, preserva; se não, gera UUID
    map $http_x_correlation_id $correlation_id_final {
        default $http_x_correlation_id;
        ""      $request_id;
    }

    # Upstreams com balanceamento ativo-ativo entre app1 e app2 (RFI-02, RFI-03)
    upstream usuarios_backend {
        server app1-usuarios:8101 max_fails=3 fail_timeout=15s;
        server app2-usuarios:8101 max_fails=3 fail_timeout=15s;
    }

    upstream produtos_backend {
        server app1-produtos:8102 max_fails=3 fail_timeout=15s;
        server app2-produtos:8102 max_fails=3 fail_timeout=15s;
    }

    upstream fornecimentos_backend {
        server app1-fornecimentos:8103 max_fails=3 fail_timeout=15s;
        server app2-fornecimentos:8103 max_fails=3 fail_timeout=15s;
    }

    upstream demanda_backend {
        server app1-demanda:8104 max_fails=3 fail_timeout=15s;
        server app2-demanda:8104 max_fails=3 fail_timeout=15s;
    }

    upstream mercado_backend {
        server app1-mercado:8105 max_fails=3 fail_timeout=15s;
        server app2-mercado:8105 max_fails=3 fail_timeout=15s;
    }

    upstream negociacao_backend {
        server app1-negociacao:8106 max_fails=3 fail_timeout=15s;
        server app2-negociacao:8106 max_fails=3 fail_timeout=15s;
    }

    upstream pedidos_backend {
        server app1-pedidos:8107 max_fails=3 fail_timeout=15s;
        server app2-pedidos:8107 max_fails=3 fail_timeout=15s;
    }

    upstream logistica_backend {
        server app1-logistica:8108 max_fails=3 fail_timeout=15s;
        server app2-logistica:8108 max_fails=3 fail_timeout=15s;
    }

    upstream transportadoras_backend {
        server app1-transportadoras:8109 max_fails=3 fail_timeout=15s;
        server app2-transportadoras:8109 max_fails=3 fail_timeout=15s;
    }

    upstream frontends_backend {
        server frontends:80;
    }

    # 1. Servidor HTTP (Porta 8080) com Redirecionamento 301 para HTTPS (RNF-16)
    # ou suporte direto a rotas de teste
    server {
        listen 8080;
        server_name localhost;

        # Health check direto no gateway (RF-17, RNF-05)
        location = /health {
            return 200 '{"status":"UP"}';
            add_header Content-Type application/json;
        }

        location = /health/ready {
            return 200 '{"status":"READY"}';
            add_header Content-Type application/json;
        }

        # Redirecionamento 301 obrigatório para HTTPS (RNF-16) quando exigido
        location /ssl-redirect/ {
            return 301 https://$host:8443$request_uri;
        }

        # Demais requisições atendidas normalmente na porta 8080 para a PoC local
        location / {
            include /etc/nginx/common_routes.conf;
        }
    }

    # 2. Servidor HTTPS (Porta 8443) com terminação TLS (RNF-16, RFI-01)
    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location = /health {
            return 200 '{"status":"UP"}';
            add_header Content-Type application/json;
        }

        location = /health/ready {
            return 200 '{"status":"READY"}';
            add_header Content-Type application/json;
        }

        location / {
            include /etc/nginx/common_routes.conf;
        }
    }
}
