services:
  demanda-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: portal-b2b/demanda-service:1.0.0
    container_name: portal-b2b-demanda-service
    restart: unless-stopped
    ports:
      - "8104:8104"
    environment:
      - SERVICE_NAME=demanda-service
      - PORT=8104
      - DB_HOST=pg-primary
      - DB_PORT=5432
      - DB_NAME=portal_b2b
      - DB_USER=svc_demanda
      - DB_PASSWORD=SvcDemandaPass2026!#
      - KAFKA_BOOTSTRAP_SERVERS=rp-0:19092
    networks:
      - portal-net

networks:
  portal-net:
    external: true
