services:
  logistica-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: portal-b2b/logistica-service:1.0.0
    container_name: portal-b2b-logistica-service
    restart: unless-stopped
    ports:
      - "8108:8108"
    environment:
      - SERVICE_NAME=logistica-service
      - PORT=8108
      - DB_HOST=pg-primary
      - DB_PORT=5432
      - DB_NAME=portal_b2b
      - DB_USER=svc_logistica
      - DB_PASSWORD=SvcLogisticaPass2026!#
      - KAFKA_BOOTSTRAP_SERVERS=rp-0:19092
    networks:
      - portal-net

networks:
  portal-net:
    external: true
