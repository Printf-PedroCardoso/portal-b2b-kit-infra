services:
  produtos-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: portal-b2b/produtos-service:1.0.0
    container_name: portal-b2b-produtos-service
    restart: unless-stopped
    ports:
      - "8102:8102"
    environment:
      - SERVICE_NAME=produtos-service
      - PORT=8102
      - DB_HOST=pg-primary
      - DB_PORT=5432
      - DB_NAME=portal_b2b
      - DB_USER=svc_produtos
      - DB_PASSWORD=SvcProdutosPass2026!#
      - KAFKA_BOOTSTRAP_SERVERS=rp-0:19092
    networks:
      - portal-net

networks:
  portal-net:
    external: true
