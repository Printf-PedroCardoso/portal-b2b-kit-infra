services:
  transportadoras-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: portal-b2b/transportadoras-service:1.0.0
    container_name: portal-b2b-transportadoras-service
    restart: unless-stopped
    ports:
      - "8109:8109"
    environment:
      - SERVICE_NAME=transportadoras-service
      - PORT=8109
      - DB_HOST=pg-primary
      - DB_PORT=5432
      - DB_NAME=portal_b2b
      - DB_USER=svc_transportadoras
      - DB_PASSWORD=SvcTransportadorasPass2026!#
      - KAFKA_BOOTSTRAP_SERVERS=rp-0:19092
    networks:
      - portal-net

networks:
  portal-net:
    external: true
